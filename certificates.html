    <main id="main-content">
      <section class="section certificates-page">
        <h2 class="section-title reveal">
          <span class="index mono">Certificates</span>
        </h2>
        <p class="section-sub reveal">
          Every certificate and course I've completed, browsable like a file
          explorer. Click a row to open it.
        </p>

        <div class="explorer glass reveal">
          <div class="explorer-toolbar mono">
            <span class="explorer-path">
              <svg
                class="explorer-path-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"
                />
              </svg>
              Mason Clement &gt; Certificates
            </span>
            <span class="explorer-count" id="explorer-count"></span>
          </div>

          <div class="explorer-table">
            <div class="explorer-row explorer-head">
              <span class="col-name">Name</span>
              <span class="col-date">Date Uploaded</span>
              <span class="col-type">Type</span>
              <span class="col-size">Size</span>
            </div>

          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer glass">
      <div class="footer-inner">
        <p>&copy; <span id="year"></span> Mason Clement</p>
      </div>
    </footer>

    <!-- FILE PREVIEW MODAL -->
    <div class="file-modal" id="file-modal" aria-hidden="true">
      <div class="file-modal-backdrop" data-modal-close></div>
      <div class="file-modal-dialog">
        <div class="file-modal-actions">
          <a class="file-modal-download" id="file-modal-download" hidden aria-label="Download PDF">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v13" />
              <path d="M7 11l5 5 5-5" />
              <path d="M4 20h16" />
            </svg>
          </a>
          <button class="file-modal-close" data-modal-close aria-label="Close preview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="5" y1="5" x2="19" y2="19" />
              <line x1="19" y1="5" x2="5" y2="19" />
            </svg>
          </button>
        </div>
        <div class="file-modal-card">
          <div class="file-modal-body" id="file-modal-body"></div>
        </div>
      </div>
    </div>

    <!-- INFO MODAL (Cover Letter / Transcripts) -->
    <div class="info-modal" id="info-modal" aria-hidden="true">
      <div class="info-modal-backdrop" data-modal-close></div>
      <div class="glass shine card status-card info-modal-card">
        <button
          class="file-modal-close info-modal-close"
          data-modal-close
          aria-label="Close"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <line x1="5" y1="5" x2="19" y2="19" />
            <line x1="19" y1="5" x2="5" y2="19" />
          </svg>
        </button>
        <svg
          class="status-icon"
          id="info-modal-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
        <h3 class="status-title" id="info-modal-title"></h3>
        <p class="status-text" id="info-modal-text"></p>
        <a class="status-link mono" id="info-modal-link" data-modal-close hidden></a>
      </div>
    </div>
